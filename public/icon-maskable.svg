<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradientMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D1A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="rflRedMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="glowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable icon -->
  <rect width="512" height="512" fill="url(#bgGradientMask)" />

  <!-- Safe-zone centered group (80% safe zone) -->
  <g transform="translate(51, 51) scale(0.8)">
    <!-- Subtle Glow Effect -->
    <circle cx="256" cy="180" r="140" fill="#EF4444" opacity="0.15" filter="url(#glowMask)" />

    <!-- RFL Main Brand Typography -->
    <g transform="translate(256, 195)" text-anchor="middle">
      <text x="3" y="3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Arial, sans-serif" font-weight="900" font-size="142" letter-spacing="4" fill="#000000" opacity="0.6">RFL</text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Arial, sans-serif" font-weight="900" font-size="142" letter-spacing="4">
        <tspan fill="url(#rflRedMask)">R</tspan>
        <tspan fill="url(#rflRedMask)">F</tspan>
        <tspan fill="#FFFFFF">L</tspan>
      </text>
    </g>

    <!-- Speed Motion Lines -->
    <g stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.85">
      <line x1="120" y1="290" x2="190" y2="290" />
      <line x1="90" y1="305" x2="185" y2="305" stroke-width="5" />
      <line x1="135" y1="320" x2="180" y2="320" />
    </g>

    <!-- Delivery / Logistics Truck Icon -->
    <g transform="translate(195, 260) scale(1.15)">
      <!-- Truck Cargo Body -->
      <path d="M 10 10 L 80 10 C 82 10 84 12 84 14 L 84 55 L 10 55 C 8 55 6 53 6 51 L 6 14 C 6 12 8 10 10 10 Z" fill="#F8FAFC" />
      <path d="M 6 30 L 84 30 L 84 37 L 6 37 Z" fill="#EF4444" />
      
      <!-- Truck Cabin -->
      <path d="M 88 22 L 105 22 C 108 22 111 25 113 28 L 122 41 C 124 44 125 47 125 50 L 125 55 L 88 55 Z" fill="#E2E8F0" />
      <!-- Cabin Window -->
      <path d="M 92 26 L 104 26 C 106 26 108 28 109 30 L 115 39 C 116 41 115 43 113 43 L 92 43 Z" fill="#0284C7" />
      <!-- Headlight -->
      <rect x="122" y="47" width="4" height="5" rx="1.5" fill="#FBBF24" />
      <!-- Front Bumper -->
      <rect x="120" y="52" width="7" height="4" rx="1" fill="#64748B" />

      <!-- Wheels -->
      <circle cx="28" cy="58" r="11" fill="#0F172A" stroke="#94A3B8" stroke-width="2.5" />
      <circle cx="28" cy="58" r="4.5" fill="#E2E8F0" />
      <circle cx="102" cy="58" r="11" fill="#0F172A" stroke="#94A3B8" stroke-width="2.5" />
      <circle cx="102" cy="58" r="4.5" fill="#E2E8F0" />
    </g>

    <!-- Depot Badge -->
    <g transform="translate(256, 420)">
      <rect x="-130" y="-18" width="260" height="36" rx="18" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Arial, sans-serif" font-weight="700" font-size="15" fill="#38BDF8" letter-spacing="2.5">
        KHULNA DEPOT • 16531
      </text>
    </g>
  </g>
</svg>
